<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .stroke {
        fill: none;
        stroke: #111111;
        stroke-width: 12;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fill {
        fill: #111111;
      }
      .text {
        font-family: Inter, SF Pro Display, Helvetica, Arial, sans-serif;
        font-size: 52px;
        font-weight: 700;
        fill: #111111;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="496" height="496" rx="48" fill="white"/>

  <!-- Waveform -->
  <circle cx="92" cy="170" r="6" class="fill"/>
  <line x1="120" y1="185" x2="120" y2="155" class="stroke"/>
  <line x1="150" y1="205" x2="150" y2="135" class="stroke"/>
  <line x1="180" y1="220" x2="180" y2="120" class="stroke"/>
  <line x1="210" y1="195" x2="210" y2="145" class="stroke"/>

  <!-- Microphone -->
  <rect x="245" y="90" width="72" height="150" rx="36" class="stroke"/>

  <!-- Mic grill -->
  <line x1="267" y1="140" x2="295" y2="140" class="stroke"/>
  <line x1="267" y1="170" x2="295" y2="170" class="stroke"/>

  <!-- Mic stand -->
  <path d="M228 215 C228 260 334 260 334 215" class="stroke"/>
  <line x1="281" y1="260" x2="281" y2="305" class="stroke"/>
  <line x1="250" y1="305" x2="312" y2="305" class="stroke"/>

  <!-- Document -->
  <path d="
      M365 115
      H430
      L458 143
      V245
      H365
      Z
    " class="stroke"/>

  <!-- Fold -->
  <path d="M430 115 V143 H458" class="stroke"/>

  <!-- Document lines -->
  <line x1="385" y1="165" x2="435" y2="165" class="stroke"/>
  <line x1="385" y1="190" x2="435" y2="190" class="stroke"/>
  <line x1="385" y1="215" x2="435" y2="215" class="stroke"/>

  <!-- Brand -->
  <text x="256" y="420" text-anchor="middle" class="text">
    transcribe
  </text>
</svg>
